name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # Cargo's build.warnings: denies warnings in clippy, the wasm build and the tests.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain, its components and the wasm target.
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked
      - run: cargo clippy --target wasm32-unknown-unknown --locked
      - run: cargo build --target wasm32-unknown-unknown --locked
      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo nextest run --all-targets --all-features --locked --no-tests=pass
      - run: cargo test --doc --all-features --locked
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  kani-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani 0.68's compiler (rustc 1.100.0-nightly) rejects some APIs stable in 1.100.
      # This finds them in seconds; the kani job still proves the cfg(kani) code.
      - run: rustup toolchain install nightly-2026-08-21 --profile minimal
      - run: cargo +nightly-2026-08-21 check --all-targets --all-features --locked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Chauffeur's pinned nightly, so both projects run the same Miri.
      - run: rustup toolchain install nightly-2026-10-12 --profile minimal --component miri,rust-src
      - run: cargo +nightly-2026-10-12 miri test --all-features --locked

  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      # Every harness, four at a time: each takes up to a few minutes.
      - run: cargo kani -j 4 --output-format terse

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo install --locked cargo-mutants@27.1.0
      - name: Mutants on the change, or on everything on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE" ]; then
            mkdir -p target
            git diff --no-ext-diff --no-textconv --no-color "$BASE" -- src > target/mutants.diff
            cargo mutants --in-diff target/mutants.diff --timeout 120
          else
            cargo mutants --timeout 120
          fi
